[workspace]
resolver = "3"
members = ["crates/mzdraw", "crates/mzdraw-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/Freeesta/mzdraw"

# The molecule record and the structure check come from mzLab, pinned to ONE commit of its main: change the two `rev` together.
[workspace.dependencies]
mzlab-mol = { git = "https://github.com/Freeesta/mzlab", rev = "3783626345c7b79487218eb8242310eb2d5d68db" }
mzlab-feat = { git = "https://github.com/Freeesta/mzlab", rev = "3783626345c7b79487218eb8242310eb2d5d68db", default-features = false }

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1
