[workspace]
resolver = "3"
members = ["crates/mzdraw", "crates/mzdraw-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/Freeesta/mzdraw"

# The molecule record and the structure check come from mzLab, pinned to ONE commit of its main: change the two `rev` together.
[workspace.dependencies]
mzlab-mol = { git = "https://github.com/Freeesta/mzlab", rev = "4529765d63d1eca2ac2d3fd19808617cc39710a1" }
mzlab-feat = { git = "https://github.com/Freeesta/mzlab", rev = "4529765d63d1eca2ac2d3fd19808617cc39710a1", default-features = false }

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1
