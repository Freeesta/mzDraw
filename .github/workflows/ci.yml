# Fast CI of every PR and of main: format, lints, Rust tests, the site build (wasm + size cap), golden parity wasm == native, the PDFs checked by qpdf and poppler, e2e in Chromium, the PDFs in Chromium's viewer.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  PLAYWRIGHT_VERSION: 1.63.0
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            tools/.bin
          key: ci-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'tools/install_tools.sh') }}
      - name: Format and lints
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
      - name: Rust tests
        run: cargo test --locked
      - name: Site build (wasm, wasm-bindgen, wasm-opt, size cap)
        run: tools/build_site.sh
      - name: Golden parity wasm == native
        run: |
          cargo build --locked -p mzdraw --example replay && cargo build --locked -p mzdraw-wasm --example replay_glue
          node tests/parity.mjs
      - name: PDF checked by programs that are not ours (qpdf, poppler)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q qpdf poppler-utils
          tools/check_pdf.sh
      - name: Playwright (Chromium)
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" "playwright@$PLAYWRIGHT_VERSION"
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps --only-shell chromium
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install chromium
      - name: e2e of the built page
        run: node tests/e2e.mjs
      - name: Chromium's PDF viewer opens the PDFs
        run: node tools/check_pdf_viewer.mjs
  # The rename tool (tools/rename_product.sh) on a copy of the tree with the name Zzz: the copy must build and pass the same tests and
  # checks as the tree itself (Rust tests, site build with the size cap, golden parity, e2e in Chromium). The real tree is never touched.
  rename:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/.bin
          key: ci-rename-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'tools/install_tools.sh') }}
      - name: Rename a copy to Zzz (the tool needs the crates of Cargo.lock offline, to put the lock in order)
        run: |
          cargo fetch --locked
          tools/rename_product.sh --copy-to "$RUNNER_TEMP/zzz" Zzz
          git status --porcelain --untracked-files=all | tee "$RUNNER_TEMP/status.txt"
          test ! -s "$RUNNER_TEMP/status.txt"   # the real tree is untouched
      - name: The old name is left only where a rename keeps it, and the check is not blind; bad names are refused
        run: |
          old=$(sed -n 's/^slug = "\(.*\)".*/\1/p' brand.toml | head -1)
          tools/test_rename_product.sh "$RUNNER_TEMP/zzz" "$old"
      - name: The copy is formatted and lint-clean, its Rust tests pass
        working-directory: ${{ runner.temp }}/zzz
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
      - name: The copy builds the site and the module is at parity with the native crate
        working-directory: ${{ runner.temp }}/zzz
        run: |
          tools/build_site.sh
          cargo build --locked -p zzz --example replay && cargo build --locked -p zzz-wasm --example replay_glue
          node tests/parity.mjs
      - name: Playwright (Chromium)
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" "playwright@$PLAYWRIGHT_VERSION"
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps --only-shell chromium
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install chromium
      - name: e2e of the renamed page
        working-directory: ${{ runner.temp }}/zzz
        run: node tests/e2e.mjs
