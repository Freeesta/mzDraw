# Publishes the page at the root of https://freeesta.github.io/mzdraw/ on every push to main. Nothing untested goes out: the build
# job runs the same checks as ci.yml (Rust tests, site build with the size cap, golden parity, e2e of the built page) before it
# uploads the site; after the deploy the e2e test runs again against the published URL.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  PLAYWRIGHT_VERSION: 1.63.0
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            tools/.bin
          key: pages-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'tools/install_tools.sh') }}
      - name: Rust tests
        run: cargo test --locked
      - name: Site build (wasm, wasm-bindgen, wasm-opt, size cap)
        run: tools/build_site.sh
      - name: Golden parity wasm == native
        run: |
          cargo build --locked -p mzdraw --example replay
          node tests/parity.mjs
      - name: Playwright (Chromium)
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" "playwright@$PLAYWRIGHT_VERSION"
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps --only-shell chromium
      - name: e2e of the built page
        run: node tests/e2e.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  live:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      URL: ${{ needs.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - name: Playwright (Chromium)
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" "playwright@$PLAYWRIGHT_VERSION"
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps --only-shell chromium
      - name: e2e of the published page (one more try after 30 s: the CDN can lag behind the deploy)
        run: node tests/e2e.mjs "$URL" || { sleep 30; node tests/e2e.mjs "$URL"; }
