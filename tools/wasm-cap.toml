# Size cap of the optimised editor module (site/pkg/mzdraw_wasm_bg.wasm), in bytes. tools/wasm_cap.sh fails the build above `cap`.
# No PR writes a size figure: the build prints the real size (raw and gzip) and the cap check is the guard. The history of the
# measured sizes is in docs/built/size.md. Raising `cap` is the owner's decision: send the measured numbers and a proposal first,
# never raise it in a PR on your own.
# 2026-11-20: raised from 512000 to 540000 by the owner's decision, for the 2D layout of mzlab-mol.
# 2026-11-20: the owner lifted the size limit for now. `cap` is a generous guard (4000000) that only catches a runaway; revisit
# before the first release.
cap = 4000000
